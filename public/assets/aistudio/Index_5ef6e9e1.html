<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">

<title>Manajemen Kelas</title>
<style>
:root{--navy:#1e1b3a;--ungu:#a78bfa;--pink:#ff8fb1;--oren:#ffa94d;--kuning:#ffd43b;--hijau:#4ade9b;--cyan:#3dd5e0;--biru:#74a7ff;--koral:#ff8a65;
--bg:#faf9ff;--card:#fff;--teks:#1e1b3a;--abu:#6b6890;--garis:#ebe8f7}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--teks);font-size:14px}
header{background:var(--navy);color:#fff;padding:18px 20px 0;position:sticky;top:0;z-index:40}
header{padding-bottom:0}
@media(max-width:600px){header{padding:10px 12px 0}header h1{font-size:18px}}
header h1{margin:0;font-size:22px}
header .sub{color:#c9c5ee;font-size:12px;margin-top:2px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--garis);border-radius:10px;background:#fff;color:var(--teks)}
header select{background:#2c2852;color:#fff;border-color:#443f7a}
textarea{width:100%;min-height:120px}
/* menu di sisi kiri (sidebar); di layar sempit menjadi laci yang dibuka tombol ☰ */
nav{display:none}
body.sb{padding-left:240px}
body.sb nav{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--navy);padding:16px 10px 20px;overflow-y:auto;z-index:30;box-shadow:2px 0 14px rgba(30,27,58,.18)}
body.sb nav::before{content:'📚 Manajemen Kelas';color:#fff;font-weight:700;font-size:17px;padding:2px 10px 16px;margin-bottom:6px;border-bottom:1px solid #3a3566}
nav button{border:0;background:transparent;color:#c9c5ee;padding:11px 14px;border-radius:12px;cursor:pointer;font:inherit;white-space:nowrap;text-align:left;border-left:4px solid transparent}
nav button:hover{background:#2c2852;color:#fff}
nav button.on{background:#38327a;color:#fff;font-weight:700;border-left-color:var(--kuning)}
#menuBtn{display:none;background:#2c2852;color:#fff;border:1px solid #443f7a;border-radius:10px;font-size:18px;line-height:1;padding:7px 11px;cursor:pointer}
#sbov{display:none}
body.sb header h1{display:none}
@media(max-width:900px){
  body.sb{padding-left:0}
  body.sb nav{transform:translateX(-105%);transition:transform .2s;width:260px;z-index:58}
  body.sbopen nav{transform:none}
  body.sb #menuBtn{display:inline-block}
  body.sb header h1{display:block}
  body.sbopen #sbov{display:block;position:fixed;inset:0;background:rgba(20,18,40,.45);z-index:55}
}
.strip{height:5px;background:linear-gradient(90deg,var(--ungu),var(--pink),var(--oren),var(--kuning),var(--hijau),var(--cyan),var(--biru))}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{margin:0 0 4px;font-size:22px}
.lead{color:var(--abu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--garis);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{border-radius:16px;padding:16px;color:var(--navy)}
.stat b{display:block;font-size:28px}
.stat span{font-size:12px;font-weight:600}
.btn{border:0;background:var(--navy);color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.alt{background:var(--ungu)}
.btn.ok{background:#16a96b}
.btn.bad{background:#e5484d}
.btn.ghost{background:#efecfb;color:var(--navy)}
.btn.sm{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row.end{justify-content:flex-end;margin:12px 0 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--abu);white-space:nowrap}
td.c,th.c{text-align:center}
td input.n{width:70px;text-align:center}
.chip{border:2px solid var(--garis);background:#fff;border-radius:9px;width:34px;height:34px;font-weight:700;cursor:pointer;color:var(--abu)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--navy)}
.kode{display:inline-block;min-width:26px;text-align:center;border-radius:7px;padding:3px 5px;font-weight:700;font-size:12px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.siklus{border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
.siklus i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.muted{color:var(--abu);font-size:12px}
.pill{display:inline-block;background:#efecfb;border-radius:99px;padding:4px 10px;margin:2px;font-size:12px}
details{border:1px solid var(--garis);border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
summary i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--navy);color:#fff}
details .in{padding:0 16px 14px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
details h4{margin:8px 0 4px;font-size:11px;letter-spacing:.06em;color:var(--abu);text-transform:uppercase}
details ul{margin:0;padding-left:18px}
.warn{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;margin-bottom:8px;background:#fff4ee}
.bar{height:10px;background:#efecfb;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--hijau)}
label.f{display:block;margin-bottom:10px;font-weight:600;font-size:12px;color:var(--abu)}
label.f input,label.f select{width:100%;margin-top:4px;color:var(--teks)}
#modal{position:fixed;inset:0;background:rgba(30,27,58,.55);display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
#modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:60}
#loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:70;font-weight:700}
.phead{display:none}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e1b3a,#3b3470);display:none;place-items:center;z-index:65;padding:16px;overflow:auto}
.lbox{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:400px}
.lbox h1{margin:0 0 4px;font-size:22px}
.tabs2{display:flex;gap:6px;margin:14px 0}
.tabs2 button{flex:1}
.err{color:#e5484d;font-size:13px;min-height:18px;margin:6px 0}
#modal .box.lebar{max-width:720px}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.kh{font-size:11px;font-weight:700;color:var(--abu);text-align:center}
.kd{min-height:50px;border:1px solid var(--garis);border-radius:8px;padding:3px 5px;font-size:12px;background:#fff}
.kd.today{outline:2px solid var(--navy)}
.kd i{display:block;height:5px;border-radius:3px;margin-top:3px}
.doc h3{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--abu)}
.doc p{margin:0}
#pres{position:fixed;inset:0;background:var(--navy);color:#fff;display:none;z-index:80;grid-template-rows:1fr auto}
#pres.on{display:grid}
#pres .ps{display:grid;align-content:center;justify-items:center;text-align:center;padding:32px;font-size:clamp(18px,3.2vw,34px);line-height:1.5}
#pres .ps h1{font-size:clamp(28px,5vw,56px);margin:0 0 18px}
#pres .pc{display:flex;gap:12px;justify-content:center;align-items:center;padding:14px}
/* denah */
.peta{width:max-content;margin:0 auto;padding:4px}
.papan{background:var(--navy);color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.08em;margin-bottom:14px}
.prow{display:flex;gap:8px;margin-bottom:8px}
.pgap{width:22px;flex:none}
.dk{width:98px;height:56px;flex:none;padding:4px 6px;border:2px dashed var(--garis);background:#fff;border-radius:10px;font:inherit;font-size:12px;font-weight:600;color:var(--abu);cursor:pointer;line-height:1.15;overflow:hidden}
.dk.f{border-style:solid;background:#ebe6ff;border-color:#cfc4ff;color:var(--teks)}
.dk.me{background:#ffe9cc;border-color:var(--oren)}
.dk.sel{outline:3px solid var(--navy)}
.dk:disabled{cursor:default}
.pl{border:2px solid var(--garis);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px;margin:3px}
.pl.on{background:var(--ungu);border-color:var(--ungu);color:#fff}
/* struktur */
.org{text-align:center;overflow-x:auto;padding-bottom:6px}
.lvl{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:26px}
.lvl.first{padding-top:0}
.lvl:not(.first)::before{content:'';position:absolute;top:0;left:50%;height:26px;border-left:2px solid var(--garis)}
.nd{background:#fff;border:2px solid var(--c,#cfc4ff);border-radius:14px;padding:9px 16px;min-width:140px;text-align:center}
.nd[onclick]{cursor:pointer}
.nd small{display:block;font-size:11px;color:var(--abu);text-transform:uppercase;letter-spacing:.04em}
.nd b{display:block;font-size:14px}
/* jadwal */
.jd{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#f4f1ff;margin-bottom:6px}
.jd.ist{background:#fff4ee}
.jd[onclick]{cursor:pointer}
.jm{font-size:11px;font-weight:700;color:var(--abu);white-space:nowrap;padding-top:2px}
@media print{
  header,nav,.strip,.noprint,#toast,#modal,#sbov,#menuBtn{display:none!important}
  body,body.sb{background:#fff;padding-left:0}
  .phead{display:block;margin-bottom:12px}
  .card{border:0;padding:0}
  main{max-width:none;padding:0}
  .kode{border:1px solid #999}
}
</style>
</head>

/* ================= STATE & UTIL ================= */
let DB = {}, K = '', TAB = 'dash';
let ABS_DATE = '', ABS_DRAFT = null, ABS_NOTE = {}, ABS_MODE = 'input', REKAP_BULAN = '';
let TUG_SEL = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmt = n => n == null ? '-' : (Math.round(n * 10) / 10).toString().replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let TOKEN = '', ROLE = '', PORTAL = null;
const raw = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
const pesanErr = e => String((e && e.message) || e).replace(/^(Error|Exception):\s*/, '');
const api = async (fn, ...a) => {
  try { return await raw(fn, TOKEN, ...a); }
  catch (e) { if (pesanErr(e).indexOf('SESI_HABIS') >= 0) sesiHabis(); throw e; }
};

function toast(m, ms) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms || 2200);
}
function modal(html, lebar) { $('#modal').innerHTML = '<div class="box' + (lebar ? ' lebar' : '') + '">' + html + '</div>'; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
function ask(msg) {
  return new Promise(r => {
    modal('<p>' + esc(msg) + '</p><div class="row end"><button class="btn ghost" id="mNo">Batal</button><button class="btn bad" id="mYes">Ya, lanjut</button></div>');
    $('#mYes').onclick = () => { closeModal(); r(true); };
    $('#mNo').onclick = () => { closeModal(); r(false); };
  });
}
async function persist(...names) {
  try {
    toast('Menyimpan…', 8000);
    for (const n of names) await api('api_saveSheet', n, DB[n]);
    toast('✔ Tersimpan');
    return true;
  } catch (e) { toast('Gagal menyimpan: ' + (e.message || e), 5000); return false; }
}

/* ================= DATA HELPER ================= */
const S = () => DB.Pengaturan;
const kelasObj = () => DB.Kelas.find(k => k.ID === K) || {};
const siswaK = () => DB.Siswa.filter(s => s.Kelas === K).sort((a, b) => a.Nama.localeCompare(b.Nama));
const namaSiswa = id => (DB.Siswa.find(s => s.ID === id) || {}).Nama || '(dihapus)';
const absK = () => DB.Absensi.filter(a => a.Kelas === K);
const tanggalK = () => [...new Set(absK().map(a => a.Tanggal))].sort();
const tugasK = () => DB.Tugas.filter(t => t.Kelas === K).sort((a, b) => (a.Tenggat || '').localeCompare(b.Tenggat || ''));
const bobot = () => ['b_sikap','b_tugas','b_proyek','b_uts','b_uas'].map(k => num(S()[k]) || 0);
const kkm = () => num(S().kkm) || 70;

function absStat(sid) {
  const c = {H:0,S:0,I:0,A:0,T:0,D:0};
  absK().filter(a => a.SiswaID === sid).forEach(r => { if (c[r.Kode] != null) c[r.Kode]++; });
  const total = tanggalK().length, hadir = c.H + c.T + c.D;
  return Object.assign(c, {total, hadir, pct: total ? hadir / total * 100 : null});
}
function nilaiRow(sid, buat) {
  let r = DB.Nilai.find(n => n.Kelas === K && n.SiswaID === sid);
  if (!r && buat) { r = {Kelas:K, SiswaID:sid, Sikap:'', Tugas:'', Proyek:'', UTS:'', UAS:''}; DB.Nilai.push(r); }
  return r;
}
function akhir(r) {
  if (!r) return null;
  const w = bobot(); let tot = 0, ada = false;
  ['Sikap','Tugas','Proyek','UTS','UAS'].forEach((k, i) => { const v = num(r[k]); if (v != null) { ada = true; tot += v * w[i] / 100; } });
  return ada ? tot : null;
}
function predikat(n) {
  if (n == null) return ['-', '', '#efecfb'];
  if (n >= 90) return ['A', 'Sangat Baik', '#4ade9b'];
  if (n >= 80) return ['B', 'Baik', '#74a7ff'];
  if (n >= kkm()) return ['C', 'Cukup', '#ffd43b'];
  return ['D', 'Perlu Bimbingan', '#ff8a65'];
}
function tindakLanjut(n) {
  if (n == null) return '-';
  if (n < kkm()) return 'Remedial';
  if (n >= 90) return 'Pengayaan';
  return 'Penguatan';
}
function tanggaLevel(a) { return a >= 10 ? 4 : a >= 5 ? 3 : a >= 3 ? 2 : a >= 1 ? 1 : 0; }
function mingguKe() {
  const m = S().mulai; if (!m) return null;
  const d = Math.floor((new Date(ymd(new Date())) - new Date(m)) / 86400000);
  return d < 0 ? 0 : Math.floor(d / 7) + 1;
}
const kodeTag = k => `<span class="kode" style="background:${(KODE[k] || [0, '#efecfb'])[1]}">${esc(k || '·')}</span>`;
// Wali kelas diambil otomatis dari akun pengguna yang ditugaskan sebagai wali kelas tersebut; jika belum ada, memakai isian di Pengaturan.
function waliKelasNama(kelasId) {
  const src = PERAN === 'admin' ? (DB.Pengguna || []) : (DB.GuruList || []);
  const n = src.filter(u => String(u.KelasWali || '').split(',').includes(kelasId)).map(u => u.Nama);
  return n.length ? n.join(', ') : (S().wali || '');
}
const printHead = () => `<div class="phead"><h2>${esc(S().sekolah)}</h2><div>Kelas: ${esc(kelasObj().Nama)} · Mata Pelajaran: ${esc(kelasObj().Mapel)} · Semester ${esc(S().semester)}</div><div>Guru: ${esc(S().guru)} · Wali Kelas: ${esc(waliKelasNama(K))}</div></div>`;

/* ================= RENDER UTAMA ================= */
function menu(b) { document.body.classList.toggle('sbopen', b === undefined ? !document.body.classList.contains('sbopen') : b); }
function go(t) { TAB = t; if (t === 'abs') ABS_DRAFT = null; menu(false); render(); window.scrollTo(0, 0); }

/* ================= DASBOR ================= */
function vDash() {
  const ss = siswaK(), pct = ss.map(s => absStat(s.ID).pct).filter(x => x != null);
  const rata = pct.length ? pct.reduce((a, b) => a + b, 0) / pct.length : null;
  const tIds = tugasK().map(t => t.ID);
  const tepat = DB.Pengumpulan.filter(p => tIds.includes(p.TugasID) && p.Status === 'Tepat Waktu').length;
  const tepatPct = tIds.length && ss.length ? tepat / (tIds.length * ss.length) * 100 : null;
  const na = ss.map(s => akhir(nilaiRow(s.ID))).filter(x => x != null);
  const naRata = na.length ? na.reduce((a, b) => a + b, 0) / na.length : null;
  const mg = mingguKe();
  const fase = mg ? KALENDER.find(f => mg >= f[0] && mg <= f[1]) : null;
  const peringatan = ss.map(s => ({s, a: absStat(s.ID).A})).filter(x => x.a > 0).sort((a, b) => b.a - a.a);
  const hr = hariIni();
  const jdHari = DB.Jadwal.filter(x => x.Kelas === K && x.Hari === hr && tampilHariIni(x)).sort((a, b) => (a.Mulai || '').localeCompare(b.Mulai || ''));
  const pkHari = DB.Piket.filter(x => x.Kelas === K && x.Hari === hr);
  const ind = (v, tgt) => v == null ? '' : `<span class="tag" style="background:${v >= tgt ? '#d9f7e8' : '#ffe3da'}">${v >= tgt ? 'Target tercapai' : 'Di bawah target ' + tgt + '%'}</span>`;
  return `
  <h2>Dasbor ${esc(kelasObj().Nama)}</h2>
  <p class="lead">${esc(kelasObj().Mapel || 'Isi mata pelajaran di Pengaturan')} ${mg !== null ? '· <b>' + (mg === 0 ? 'Semester belum dimulai' : 'Minggu ke-' + mg) + '</b>' : ''} ${fase ? '· ' + esc(fase[2]) : ''}</p>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat" style="background:#a78bfa"><b>${ss.length}</b><span>Siswa</span></div>
    <div class="stat" style="background:#ff8fb1"><b>${rata == null ? '-' : fmt(rata) + '%'}</b><span>Rata-rata kehadiran</span><br>${ind(rata, 90)}</div>
    <div class="stat" style="background:#4ade9b"><b>${tepatPct == null ? '-' : fmt(tepatPct) + '%'}</b><span>Tugas tepat waktu</span><br>${ind(tepatPct, 90)}</div>
    <div class="stat" style="background:#ffd43b"><b>${fmt(naRata)}</b><span>Rata-rata nilai akhir</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Siklus 8 tahap (klik untuk membuka)</h3>
      <div class="grid" style="gap:8px">${TAHAP.map(t => `<div class="siklus" style="background:${t.c}33" onclick="go('${t.tab}')"><i style="background:${t.c}">${t.n}</i>${esc(t.t)}</div>`).join('')}</div>
    </div>
    <div class="card"><h3>Tindak lanjut ketidakhadiran (Alpa)</h3>
      ${peringatan.length ? peringatan.map(x => { const l = tanggaLevel(x.a); return `<div class="warn"><span class="tag" style="background:${LEVEL[l][2]}">Tahap ${l}</span><div><b>${esc(x.s.Nama)}</b> · ${x.a} hari alpa<br><span class="muted">${esc(TANGGA[l])}</span></div></div>`; }).join('') : '<p class="muted">Belum ada siswa dengan catatan alpa. 🎉</p>'}
      <p class="muted">Batas hari adalah usulan; sesuaikan dengan tata tertib sekolah.</p>
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>🗓️ Jadwal pelajaran hari ini${hr ? ' (' + hr + ')' : ''}</h3>
      ${jdHari.length ? jdHari.map(x => `<div class="jd ${x.Jenis === 'Istirahat' ? 'ist' : ''}"><span class="jm">${esc(x.Mulai)}–${esc(x.Selesai)}</span><div><b>${esc(x.Mapel)}</b>${x.Guru ? '<br><span class="muted">' + esc(x.Guru) + '</span>' : ''}</div></div>`).join('') : `<p class="muted">${hr ? 'Belum ada jadwal untuk hari ini.' : 'Hari ini libur.'} <a href="#" onclick="go('jad');return false">Buka jadwal</a></p>`}</div>
    <div class="card"><h3>🧹 Petugas piket hari ini</h3>
      ${pkHari.length ? pkHari.map(p => `<div class="warn" style="background:#f4f1ff"><div><b>${esc(namaSiswa(p.SiswaID))}</b><br><span class="muted">${esc(p.Tugas || '-')}</span></div></div>`).join('') : `<p class="muted">${hr ? 'Belum ada petugas piket hari ini.' : 'Hari ini libur.'} <a href="#" onclick="go('pik');return false">Atur piket</a></p>`}</div>
  </div>`;
}

/* ================= ABSENSI ================= */
function loadDraft() {
  ABS_DRAFT = {}; ABS_NOTE = {};
  absK().filter(a => a.Tanggal === ABS_DATE).forEach(a => { ABS_DRAFT[a.SiswaID] = a.Kode; ABS_NOTE[a.SiswaID] = a.Keterangan || ''; });
}
function chips(sid) {
  return Object.keys(KODE).map(k => `<button class="chip ${ABS_DRAFT[sid] === k ? 'on' : ''}" style="--c:${KODE[k][1]}" title="${KODE[k][0]}" onclick="setKode('${sid}','${k}')">${k}</button>`).join(' ');
}
function setKode(sid, k) { ABS_DRAFT[sid] = ABS_DRAFT[sid] === k ? '' : k; $('#ch_' + sid).innerHTML = chips(sid); $('#cnt').textContent = hitungDraft(); }
const hitungDraft = () => siswaK().filter(s => ABS_DRAFT[s.ID]).length + ' / ' + siswaK().length + ' terisi';
function setTanggal(v) { ABS_DATE = v; loadDraft(); render(); }
function semua(k) { siswaK().forEach(s => ABS_DRAFT[s.ID] = k); render(); }
async function simpanAbsensi() {
  const recs = siswaK().filter(s => ABS_DRAFT[s.ID]).map(s => ({SiswaID: s.ID, Kode: ABS_DRAFT[s.ID], Keterangan: ABS_NOTE[s.ID] || ''}));
  try {
    toast('Menyimpan…', 8000);
    await api('api_saveAbsensi', K, ABS_DATE, recs);
    DB.Absensi = DB.Absensi.filter(a => !(a.Kelas === K && a.Tanggal === ABS_DATE));
    recs.forEach(r => DB.Absensi.push({Kelas:K, Tanggal:ABS_DATE, SiswaID:r.SiswaID, Kode:r.Kode, Keterangan:r.Keterangan, Sumber:''}));
    toast('✔ Absensi tersimpan'); render();
  } catch (e) { toast('Gagal: ' + (e.message || e), 5000); }
}
function vAbs() {
  if (!ABS_DATE) ABS_DATE = ymd(new Date());
  if (!REKAP_BULAN) REKAP_BULAN = ABS_DATE.slice(0, 7);
  if (ABS_DRAFT === null) loadDraft();
  const sw = `<div class="row noprint"><button class="btn ${ABS_MODE === 'input' ? '' : 'ghost'}" onclick="ABS_MODE='input';render()">Input harian</button><button class="btn ${ABS_MODE === 'rekap' ? '' : 'ghost'}" onclick="ABS_MODE='rekap';render()">Rekap bulanan</button></div>`;
  const ss = siswaK();
  if (!ss.length) return `<h2>Absensi</h2>${sw}<div class="card">Belum ada siswa. Tambahkan dulu di menu Siswa.</div>`;
  if (ABS_MODE === 'rekap') return vRekap(sw, ss);
  const legend = Object.keys(KODE).map(k => `${kodeTag(k)} ${KODE[k][0]}`).join(' &nbsp; ');
  return `<h2>Absensi harian</h2><p class="lead">Catat dalam 5 menit pertama. Terlambat (T) dan Dispensasi (D) dihitung hadir, tetapi tetap dicatat.</p>${sw}
  <div class="card">
    ${absK().some(a => a.Tanggal === ABS_DATE && a.Sumber === 'sekretaris') ? '<div class="warn" style="background:#fff4ee"><span class="tag" style="background:#ffd43b">Diisi sekretaris</span><div>Absensi tanggal ini diisi sekretaris kelas dan belum dikonfirmasi. Periksa, ubah bila perlu, lalu klik <b>Simpan absensi</b> untuk mengonfirmasi.</div></div>' : ''}
    <div class="row"><label>Tanggal <input type="date" value="${ABS_DATE}" onchange="setTanggal(this.value)"></label>
      <button class="btn ghost sm" onclick="semua('H')">Semua Hadir</button>
      <button class="btn ghost sm" onclick="ABS_DRAFT={};render()">Kosongkan</button>
      <span class="muted" id="cnt">${hitungDraft()}</span>
      <button class="btn ok" style="margin-left:auto" onclick="simpanAbsensi()">💾 Simpan absensi</button></div>
    <div class="muted" style="margin-bottom:10px">${legend}</div>
    <div class="tw"><table><tr><th>#</th><th>Nama</th><th>Status</th><th>Keterangan (jam datang / alasan / bukti)</th></tr>
    ${ss.map((s, i) => `<tr><td>${i + 1}</td><td><b>${esc(s.Nama)}</b></td><td id="ch_${s.ID}" style="white-space:nowrap">${chips(s.ID)}</td>
      <td><input style="width:100%;min-width:180px" value="${esc(ABS_NOTE[s.ID] || '')}" oninput="ABS_NOTE['${s.ID}']=this.value"></td></tr>`).join('')}</table></div>
  </div>`;
}
function vRekap(sw, ss) {
  const [y, m] = REKAP_BULAN.split('-').map(Number);
  const tgl = tanggalK().filter(t => t.slice(0, 7) === REKAP_BULAN);
  const peta = {}; absK().forEach(a => peta[a.SiswaID + '|' + a.Tanggal] = a.Kode);
  const nm = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m - 1];
  return `<h2>Rekap absensi</h2>${sw}${printHead()}
  <div class="card"><div class="row noprint"><label>Bulan <input type="month" value="${REKAP_BULAN}" onchange="REKAP_BULAN=this.value;render()"></label>
    <button class="btn alt" onclick="window.print()">🖨️ Cetak</button></div>
    <h3>${nm} ${y}</h3>
    ${tgl.length ? `<div class="tw"><table><tr><th>Nama</th>${tgl.map(t => `<th class="c">${Number(t.slice(8))}</th>`).join('')}<th class="c">H</th><th class="c">S</th><th class="c">I</th><th class="c">A</th><th class="c">T</th><th class="c">D</th><th class="c">% Hadir (semester)</th></tr>
    ${ss.map(s => { const st = absStat(s.ID); return `<tr><td><b>${esc(s.Nama)}</b></td>${tgl.map(t => `<td class="c">${kodeTag(peta[s.ID + '|' + t] || '')}</td>`).join('')}<td class="c">${st.H}</td><td class="c">${st.S}</td><td class="c">${st.I}</td><td class="c">${st.A}</td><td class="c">${st.T}</td><td class="c">${st.D}</td><td class="c"><b>${fmt(st.pct)}${st.pct == null ? '' : '%'}</b></td></tr>`; }).join('')}</table></div>
    <p class="muted">Persentase = jumlah hadir (H, T, D) dibagi jumlah pertemuan (${tanggalK().length} pertemuan tercatat).</p>` : '<p class="muted">Belum ada absensi pada bulan ini.</p>'}</div>`;
}

async function simpanSiswa(id) {
  const nama = $('#f_nama').value.trim(); if (!nama) return toast('Nama wajib diisi');
  const nisBaru = $('#f_nis').value.trim();
  if (nisBaru && DB.Siswa.some(x => x.ID !== id && String(x.NIS).trim().toLowerCase() === nisBaru.toLowerCase())) return toast('NIS sudah dipakai siswa lain');
  let s = DB.Siswa.find(x => x.ID === id);
  if (!s) { s = {ID: uid(), Kelas: K}; DB.Siswa.push(s); }
  Object.assign(s, {Nama: nama, NIS: $('#f_nis').value.trim(), KontakOrtu: $('#f_kon').value.trim(), Alamat: $('#f_khs').value.trim(), Kesehatan: $('#f_kes').value.trim()});
  closeModal(); await persist('Siswa'); render();
}
async function hapusSiswa(id) {
  if (!await ask('Hapus siswa "' + namaSiswa(id) + '" beserta absensi dan nilainya?')) return;
  DB.Siswa = DB.Siswa.filter(s => s.ID !== id);
  DB.Absensi = DB.Absensi.filter(a => a.SiswaID !== id);
  DB.Nilai = DB.Nilai.filter(n => n.SiswaID !== id);
  DB.Pengumpulan = DB.Pengumpulan.filter(p => p.SiswaID !== id);
  DB.Perilaku = DB.Perilaku.filter(p => p.SiswaID !== id);
  DB.Denah = DB.Denah.filter(d => d.SiswaID !== id);
  DB.Piket = DB.Piket.filter(p => p.SiswaID !== id);
  DB.Struktur.forEach(s => { if (s.SiswaID === id) s.SiswaID = ''; });
  await persist('Siswa', 'Absensi', 'Nilai', 'Pengumpulan', 'Perilaku', 'Denah', 'Piket', 'Struktur'); render();
}
function formImpor() {
  modal(`<h3>Impor daftar siswa</h3><p class="muted">Satu siswa per baris. Format: <b>Nama</b> atau <b>Nama; NIS; Kontak orang tua; Alamat</b>. Bisa tempel dari Excel/Sheets.</p>

/* ---------- EKSPOR / IMPOR NILAI ---------- */
const KOLOM_NILAI = [['Sikap', 'Kehadiran & Sikap'], ['Tugas', 'Tugas & Harian'], ['Proyek', 'Proyek / Praktik'], ['UTS', 'UTS'], ['UAS', 'UAS']];
// Sel CSV: beri tanda kutip bila perlu; teks yang diawali = + - @ diberi apostrof agar tidak terbaca sebagai rumus di Excel.
const csvSel = v => {
  v = String(v == null ? '' : v);
  if (/^[=+\-@]/.test(v) && isNaN(Number(v.replace(',', '.')))) v = "'" + v;
  return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
};
const koma = v => String(v == null ? '' : v).replace('.', ',');
function barisNilai_() {
  const kepala = ['No', 'NIS', 'Nama'].concat(KOLOM_NILAI.map(k => k[1]), ['Nilai Akhir', 'Predikat', 'Tindak Lanjut']);
  const isi = siswaK().map((s, i) => {
    const r = nilaiRow(s.ID) || {}, a = akhir(r);
    return [i + 1, s.NIS, s.Nama].concat(KOLOM_NILAI.map(k => koma(r[k[0]])), [a == null ? '' : fmt(a), a == null ? '' : predikat(a)[0], a == null ? '' : tindakLanjut(a)]);
  });
  return [kepala].concat(isi);
}
const namaBerkas = () => ('Nilai_' + (kelasObj().Nama || 'kelas') + '_' + (S().semester || '')).replace(/[^\w\-]+/g, '_') + '.csv';
function unduhNilai() {
  const teks = '﻿' + barisNilai_().map(r => r.map(csvSel).join(';')).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([teks], {type: 'text/csv;charset=utf-8'}));
    a.download = namaBerkas(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('✔ File diunduh. Buka dengan Excel atau Google Sheets.', 3500);
  } catch (e) { salinNilai(); }
}
function salinNilai() {
  const teks = barisNilai_().map(r => r.join('\t')).join('\n');
  const tampil = () => modal(`<h3>Salin nilai</h3><p class="muted">Salin teks di bawah lalu tempel ke Excel/Sheets.</p><textarea id="sl_t" readonly onclick="this.select()">${esc(teks)}</textarea><div class="row end"><button class="btn" onclick="closeModal()">Tutup</button></div>`, true);
  (navigator.clipboard ? navigator.clipboard.writeText(teks) : Promise.reject()).then(() => toast('✔ Tersalin. Tempel ke Excel/Sheets.', 3000), tampil);
}
// Urai CSV/TSV: pemisah dikenali otomatis (tab, titik koma, atau koma), mendukung sel dalam tanda kutip.
function uraiCSV(t) {
  t = String(t || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n').trim();
  const baris1 = t.split('\n')[0], d = baris1.indexOf('\t') >= 0 ? '\t' : baris1.indexOf(';') >= 0 ? ';' : ',';
  const out = []; let row = [], sel = '', kutip = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (kutip) { if (c === '"') { if (t[i + 1] === '"') { sel += '"'; i++; } else kutip = false; } else sel += c; }
    else if (c === '"') kutip = true;
    else if (c === d) { row.push(sel); sel = ''; }
    else if (c === '\n') { row.push(sel); out.push(row); row = []; sel = ''; }
    else sel += c;
  }
  row.push(sel); out.push(row);
  return out.filter(r => r.some(x => String(x).trim() !== ''));
}
const normKepala = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function petaKolom(kepala) {
  const p = {};
  kepala.forEach((h, i) => {
    const n = normKepala(h);
    if (n === 'nis' || n === 'nisn') p.nis = i;
    else if (n.startsWith('nama')) p.nama = i;
    else if (n.includes('sikap') || n.includes('kehadiran')) p.Sikap = i;
    else if (n.includes('tugas') || n.includes('harian')) p.Tugas = i;
    else if (n.includes('proyek') || n.includes('praktik')) p.Proyek = i;
    else if (n === 'uts' || n.includes('tengahsemester')) p.UTS = i;
    else if (n === 'uas' || n.includes('akhirsemester')) p.UAS = i;
  });
  return p;
}
function formImporNilai() {
  modal(`<h3>Impor nilai</h3>
  <p class="muted">Pakai file hasil ekspor (CSV) yang sudah diisi, atau tempel dari Excel/Sheets. Baris judul wajib ada. Siswa dicocokkan lewat <b>NIS</b> (atau nama bila NIS kosong). Kolom yang tidak ada, atau sel kosong, tidak mengubah nilai lama. Nilai harus 0–100.</p>

let IMPOR_NILAI = [];
async function periksaImporNilai() {
  let teks = $('#in_teks').value; const f = $('#in_file').files[0];
  try { if (f) teks = await f.text(); } catch (e) { return toast('File tidak bisa dibaca'); }
  const tabel = uraiCSV(teks);
  if (tabel.length < 2) return toast('Data kosong. Sertakan baris judul dan minimal satu baris nilai.', 3500);
  const pk = petaKolom(tabel[0]), kolom = KOLOM_NILAI.map(k => k[0]).filter(k => pk[k] != null);
  if (pk.nis == null && pk.nama == null) return toast('Kolom NIS atau Nama tidak ditemukan di baris judul.', 4000);
  if (!kolom.length) return toast('Kolom nilai (Kehadiran & Sikap, Tugas, Proyek, UTS, UAS) tidak ditemukan.', 4000);
  const ss = siswaK(), hasil = [], tdkAda = [], salah = []; const sudah = new Set();
  tabel.slice(1).forEach((r, n) => {
    const nis = pk.nis != null ? String(r[pk.nis] || '').trim().toLowerCase() : '', nama = pk.nama != null ? String(r[pk.nama] || '').trim().toLowerCase() : '';
    const s = (nis && ss.find(x => String(x.NIS).trim().toLowerCase() === nis)) || (!nis && nama && ss.find(x => x.Nama.trim().toLowerCase() === nama)) || null;
    if (!s) { tdkAda.push(String(pk.nama != null ? r[pk.nama] : r[pk.nis] || '').trim() || '(baris ' + (n + 2) + ')'); return; }
    if (sudah.has(s.ID)) { salah.push(s.Nama + ': baris ganda, dilewati'); return; }
    sudah.add(s.ID);
    const ubah = {};
    kolom.forEach(k => {
      const mentah = String(r[pk[k]] == null ? '' : r[pk[k]]).trim();
      if (mentah === '') return;
      const v = num(mentah);
      if (v == null || v < 0 || v > 100) salah.push(s.Nama + ' · ' + KOLOM_NILAI.find(x => x[0] === k)[1] + ': "' + mentah + '" tidak valid (harus 0–100)');
      else ubah[k] = String(v);
    });
    if (Object.keys(ubah).length) hasil.push({sid: s.ID, nama: s.Nama, ubah: ubah});
  });
  IMPOR_NILAI = hasil;
  const jml = hasil.reduce((a, h) => a + Object.keys(h.ubah).length, 0);
  modal(`<h3>Pratinjau impor nilai</h3>
  <div class="row"><span class="tag" style="background:#d9f7e8">${hasil.length} siswa · ${jml} nilai akan diperbarui</span>${tdkAda.length ? `<span class="tag" style="background:#ffe9cc">${tdkAda.length} baris tidak cocok</span>` : ''}${salah.length ? `<span class="tag" style="background:#ffe3da">${salah.length} masalah</span>` : ''}</div>
  ${salah.length ? `<div class="warn" style="background:#ffe3da;display:block"><b>Dilewati:</b><br>${salah.slice(0, 8).map(esc).join('<br>')}${salah.length > 8 ? '<br>…' : ''}</div>` : ''}
  ${tdkAda.length ? `<div class="warn" style="background:#fff4ee;display:block"><b>Tidak ditemukan di kelas ini:</b> ${tdkAda.slice(0, 8).map(esc).join(', ')}${tdkAda.length > 8 ? ', …' : ''}</div>` : ''}
  ${hasil.length ? `<div class="tw" style="max-height:240px;overflow:auto"><table><tr><th>Nama</th>${kolom.map(k => `<th class="c">${KOLOM_NILAI.find(x => x[0] === k)[1]}</th>`).join('')}</tr>
  ${hasil.slice(0, 40).map(h => { const r = nilaiRow(h.sid) || {}; return `<tr><td>${esc(h.nama)}</td>${kolom.map(k => `<td class="c">${h.ubah[k] != null ? `<span class="muted">${esc(r[k] || '-')} →</span> <b>${esc(fmt(num(h.ubah[k])))}</b>` : ''}</td>`).join('')}</tr>`; }).join('')}</table></div>${hasil.length > 40 ? `<p class="muted">Menampilkan 40 dari ${hasil.length} siswa.</p>` : ''}` : '<p class="muted">Tidak ada nilai yang bisa diimpor.</p>'}
  <div class="row end"><button class="btn ghost" onclick="formImporNilai()">← Kembali</button><button class="btn ok" ${hasil.length ? '' : 'disabled'} onclick="terapkanImporNilai()">Terapkan</button></div>`, true);
}
async function terapkanImporNilai() {
  let jml = 0;
  IMPOR_NILAI.forEach(h => { const r = nilaiRow(h.sid, true); Object.keys(h.ubah).forEach(k => { r[k] = h.ubah[k]; jml++; }); });
  closeModal();
  if (await persist('Nilai')) toast('✔ ' + jml + ' nilai diperbarui dari ' + IMPOR_NILAI.length + ' siswa', 3500);
  IMPOR_NILAI = []; render();
}

async function buatPINSemua(timpa, seragam) {

  try {
    const r = await api('api_buatPINSemua', K, !!timpa, seragam || '');
    DB.punyaPIN = DB.punyaPIN || []; r.daftar.forEach(x => { if (!DB.punyaPIN.includes(x.id)) DB.punyaPIN.push(x.id); });
    const teks = r.daftar.map(x => [x.nama, x.nis, x.pin].join('\t')).join('\n');
    window.__pinTeks = teks;
    modal(`<h3>PIN baru (${r.daftar.length} siswa)</h3>

  } catch (e) { toast(pesanErr(e), 4000); }

function denAtur() {

const denK = () => DB.Denah.filter(d => d.Kelas === K);
const kursiDi = (r, c) => denK().find(d => String(d.Baris) === String(r) && String(d.Kolom) === String(c));
function htmlPeta(b, k, grup, kursi, klik) {
  const g = num(grup) || 0;

  for (let r = 1; r <= b; r++) {

      const o = kursi[r + '-' + c];
      h += `<button class="dk ${o ? 'f' : ''} ${o && o.Saya ? 'me' : ''} ${klik && DEN_SEL === r + '-' + c ? 'sel' : ''}" ${klik ? `onclick="${klik}(${r},${c})"` : 'disabled'} title="Baris ${r}, kolom ${c}">${o ? esc(o.Nama) + '' + (o.Saya ? ' (kamu)' : '') : (klik ? '+' : '')}</button>`;
    }
    h += '</div>';
  }
  return h + '</div></div>';
}
function denTaruh(sid, r, c) {
  DB.Denah = DB.Denah.filter(d => !(d.Kelas === K && (d.SiswaID === sid || (String(d.Baris) === String(r) && String(d.Kolom) === String(c)))));
  DB.Denah.push({Kelas: K, Baris: String(r), Kolom: String(c), SiswaID: sid}); DEN_DIRTY = true;
}
function denPilih(id) { DEN_PICK = DEN_PICK === id ? '' : id; DEN_SEL = ''; render(); }
function denKlik(r, c) {
  const pos = r + '-' + c, ada = kursiDi(r, c);
  if (DEN_PICK) { denTaruh(DEN_PICK, r, c); DEN_PICK = ''; }
  else if (DEN_SEL && DEN_SEL !== pos) {
    const [r0, c0] = DEN_SEL.split('-'), a = kursiDi(r0, c0);
    if (a && ada) { const t = a.SiswaID; a.SiswaID = ada.SiswaID; ada.SiswaID = t; }
    else if (a) { a.Baris = String(r); a.Kolom = String(c); }
    DEN_SEL = ''; DEN_DIRTY = true;
  } else if (DEN_SEL === pos) DEN_SEL = '';
  else if (ada) DEN_SEL = pos;
  render();
}
function kosongkanKursi() {
  if (!DEN_SEL) return;
  const [r, c] = DEN_SEL.split('-'), a = kursiDi(r, c);

}

async function susunDenah(mode) {

  DB.Denah = DB.Denah.filter(d => d.Kelas !== K);

async function terapkanUkuran() {

/* ---------- JADWAL PELAJARAN (reguler & blok, tanpa bentrok) ---------- */
const menit = t => { const m = /^(\d{2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : -1; };
const jamStr = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const tumpang = (a, b) => menit(a.Mulai) < menit(b.Selesai) && menit(b.Mulai) < menit(a.Selesai);
const pekanTemu = (a, b) => !a.Pekan || !b.Pekan || a.Pekan === b.Pekan;
const adaPelajaran = r => !r.Jenis || r.Jenis === 'Pelajaran';
const namaKelasId = id => (DB.Kelas.find(k => k.ID === id) || {}).Nama || '?';
const ATUR_STD = {reguler: {Sistem: 'reguler', Mulai: '07:00', Durasi: '45', Jumlah: '8', Istirahat: '3:15,6:30'}, blok: {Sistem: 'blok', Mulai: '07:00', Durasi: '90', Jumlah: '4', Istirahat: '2:30'}};
const aturJ = () => (DB.JadwalAtur || []).find(a => a.Kelas === K) || Object.assign({Kelas: K}, ATUR_STD.reguler);
// Pekan berjalan (A = ganjil, B = genap) dihitung dari tanggal mulai semester; '' bila belum diatur.
const pekanIni = () => { const m = mingguKe(); return m ? (m % 2 ? 'A' : 'B') : ''; };
const tampilHariIni = x => !x.Pekan || !pekanIni() || x.Pekan === pekanIni();
// Kerangka jam: daftar slot pelajaran dan istirahat dari pengaturan kelas.
function slotJadwal(a) {
  const dur = +a.Durasi || 45, n = +a.Jumlah || 0, ist = {};
  String(a.Istirahat || '').split(',').forEach(x => { const [k, d] = x.split(':').map(Number); if (k > 0 && d > 0) ist[k] = d; });
  const nm = a.Sistem === 'blok' ? 'Blok' : 'Jam ke-'; let t = menit(a.Mulai); const out = [];
  if (t < 0) return out;
  for (let i = 1; i <= n; i++) {
    out.push({n: i, jenis: 'Pelajaran', mulai: t, selesai: t + dur, label: nm + i}); t += dur;
    if (ist[i] && i < n) { out.push({n: i, jenis: 'Istirahat', mulai: t, selesai: t + ist[i], label: 'Istirahat'}); t += ist[i]; }
  }
  return out;
}
// Cari bentrok pada data yang terlihat: (1) kegiatan beririsan di kelas yang sama, (2) guru yang sama di dua kelas.
// Server memeriksa ulang terhadap seluruh kelas (termasuk yang tidak terlihat oleh guru/wali).
function bentrokJadwal(r, abaikanId) {
  const guru = String(r.Guru || '').trim().toLowerCase();
  for (const o of DB.Jadwal) {
    if (o === r || o.ID === abaikanId || o.Hari !== r.Hari || !tumpang(r, o) || !pekanTemu(r, o)) continue;
    if (o.Kelas === r.Kelas) return 'Bentrok di kelas ini hari ' + r.Hari + ': ' + o.Mapel + ' (' + o.Mulai + '–' + o.Selesai + ')';
    if (guru && adaPelajaran(r) && adaPelajaran(o) && String(o.Guru || '').trim().toLowerCase() === guru)
      return 'Guru ' + r.Guru + ' sudah mengajar ' + o.Mapel + ' di kelas ' + namaKelasId(o.Kelas) + ' (' + o.Mulai + '–' + o.Selesai + ')';
  }
  return '';
}
function semuaBentrok() {
  const out = [], ls = DB.Jadwal;
  for (let i = 0; i < ls.length; i++) for (let j = i + 1; j < ls.length; j++) {
    const a = ls[i], b = ls[j];
    if (a.Hari !== b.Hari || !tumpang(a, b) || !pekanTemu(a, b)) continue;
    if (a.Kelas === b.Kelas) out.push(namaKelasId(a.Kelas) + ' · ' + a.Hari + ': ' + a.Mapel + ' (' + a.Mulai + '–' + a.Selesai + ') ↔ ' + b.Mapel + ' (' + b.Mulai + '–' + b.Selesai + ')');
    else if (adaPelajaran(a) && adaPelajaran(b) && String(a.Guru || '').trim() && String(a.Guru).trim().toLowerCase() === String(b.Guru || '').trim().toLowerCase())
      out.push('Guru ' + a.Guru + ' · ' + a.Hari + ': ' + namaKelasId(a.Kelas) + ' ' + a.Mapel + ' ↔ ' + namaKelasId(b.Kelas) + ' ' + b.Mapel);
  }
  return out;
}

  return hh.map(h => ({ID: id || uid(), Kelas: K, Hari: h, Mulai: $('#j_m').value, Selesai: $('#j_s').value, Mapel: $('#j_mp').value.trim(), Guru: $('#j_g').value.trim(), Jenis: $('#j_j').value, Pekan: $('#j_p') ? $('#j_p').value : ''}));
}
function hintBentrok() {
  const el = $('#j_hint'); if (!el) return;
  const m = $('#j_m').value, t = $('#j_s').value; el.style.color = '';
  if (!m || !t) { el.textContent = ''; return; }
  if (menit(t) <= menit(m)) { el.textContent = 'Jam selesai harus setelah jam mulai.'; return; }
  for (const r of barisForm(J_ID)) { const b = bentrokJadwal(r, J_ID); if (b) { el.textContent = '⚠️ ' + b; return; } }
  el.style.color = '#16a96b'; el.textContent = '✔ Tidak bentrok';
}
function isiGuruOtomatis() {
  const gs = guruMapel($('#j_mp').value);
  $('#dl_guru').innerHTML = gs.map(g => `<option value="${esc(g)}">`).join('');
  if (gs.length === 1 && !$('#j_g').value.trim()) $('#j_g').value = gs[0];
  hintBentrok();
}
async function simpanJadwal(id) {
  const rows = barisForm(id), mp = rows.length ? rows[0].Mapel : '';
  if (!mp) return toast('Nama pelajaran wajib diisi');
  if (!rows.length) return toast('Pilih minimal satu hari');
  if (!(menit(rows[0].Mulai) >= 0 && menit(rows[0].Selesai) > menit(rows[0].Mulai))) return toast('Jam selesai harus setelah jam mulai');
  for (const r of rows) { const b = bentrokJadwal(r, id); if (b) return toast(b, 5000); }
  const salinan = JSON.stringify(DB.Jadwal);
  if (id) Object.assign(DB.Jadwal.find(j => j.ID === id), rows[0]); else rows.forEach(r => DB.Jadwal.push(r));
  closeModal();
  if (!await persist('Jadwal')) DB.Jadwal = JSON.parse(salinan); // server menolak: kembalikan
  render();
}
async function hapusJadwal(id) { closeModal(); if (!await ask('Hapus kegiatan ini dari jadwal?')) return; DB.Jadwal = DB.Jadwal.filter(j => j.ID !== id); await persist('Jadwal'); render(); }

/* ---------- KALENDER AKADEMIK ---------- */
function htmlBulan(ym, evs) {
  const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate(), off = (new Date(y, m - 1, 1).getDay() + 6) % 7, hari = ymd(new Date());
  let h = '<div class="kal">' + ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x => `<div class="kh">${x}</div>`).join('');
  for (let i = 0; i < off; i++) h += '<div></div>';
  for (let d = 1; d <= n; d++) {
    const t = ym + '-' + pad(d), es = evs.filter(e => e.Mulai <= t && (e.Selesai || e.Mulai) >= t);
    h += `<div class="kd ${t === hari ? 'today' : ''}" ${es.length ? `title="${esc(es.map(e => e.Kegiatan).join(' · '))}"` : ''}><b>${d}</b>${es.slice(0, 3).map(e => `<i style="background:${JENIS_AK[e.Jenis] || JENIS_AK.Lainnya}"></i>`).join('')}</div>`;
  }
  return h + '</div>';
}
const legendAk = () => Object.keys(JENIS_AK).map(j => `<span class="tag" style="background:${JENIS_AK[j]}66">${j}</span>`).join(' ');
function htmlAkList(evs, edit) {
  const s = evs.slice().sort((a, b) => a.Mulai.localeCompare(b.Mulai));
  return `<div class="tw"><table><tr><th>Tanggal</th><th>Kegiatan</th><th>Jenis</th>${edit ? '<th></th>' : ''}</tr>
  ${s.map(e => `<tr><td style="white-space:nowrap">${tglIndo(e.Mulai)}${e.Selesai && e.Selesai !== e.Mulai ? ' – ' + tglIndo(e.Selesai) : ''}</td><td><b>${esc(e.Kegiatan)}</b></td><td><span class="tag" style="background:${(JENIS_AK[e.Jenis] || JENIS_AK.Lainnya)}66">${esc(e.Jenis || 'Lainnya')}</span></td>${edit ? `<td style="white-space:nowrap"><button class="btn ghost sm" onclick="formAkademik('${e.ID}')">Edit</button> <button class="btn bad sm" onclick="hapusAkademik('${e.ID}')">Hapus</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="4" class="muted">Belum ada kegiatan.</td></tr>`}</table></div>`;
}
function htmlAkademik() {
  if (!AK_BULAN) AK_BULAN = ymd(new Date()).slice(0, 7);
  const [y, m] = AK_BULAN.split('-').map(Number), nm = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m - 1];
  return `<div class="card"><h3>Kalender akademik</h3>
  <div class="row noprint">${PERAN === 'admin' ? `<button class="btn ok" onclick="formAkademik('')">+ Tambah kegiatan</button><button class="btn alt" onclick="templateAkademik()">📋 Isi template dari tanggal mulai semester</button>` : ''}<button class="btn ghost" onclick="window.print()">🖨️ Cetak</button></div>
  <div class="grid g2"><div><div class="row noprint"><button class="btn ghost sm" onclick="gantiBulanAk(-1)">◀</button><b style="min-width:130px;text-align:center">${nm} ${y}</b><button class="btn ghost sm" onclick="gantiBulanAk(1)">▶</button></div>
    ${htmlBulan(AK_BULAN, DB.Akademik)}<div style="margin-top:8px">${legendAk()}</div></div>
  <div style="max-height:420px;overflow:auto">${htmlAkList(DB.Akademik, PERAN === 'admin')}</div></div>
  <p class="muted">Kalender akademik berlaku untuk semua kelas. Template dibuat dari tanggal mulai semester di Pengaturan (dianggap hari Senin) dan bisa diedit.</p></div>`;
}
function gantiBulanAk(n) { const [y, m] = AK_BULAN.split('-').map(Number), d = new Date(y, m - 1 + n, 1); AK_BULAN = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); }
async function templateAkademik() {
  const mulai = S().mulai; if (!mulai) return toast('Isi "Tanggal mulai semester" di Pengaturan dulu', 3500);
  if (DB.Akademik.length && !await ask('Template akan DITAMBAHKAN ke kegiatan yang sudah ada. Lanjutkan?')) return;
  const jenis = f => /Ujian/.test(f[2]) ? 'Ujian' : /rapor/i.test(f[2]) ? 'Rapor' : 'Kegiatan belajar';
  KALENDER.forEach(f => DB.Akademik.push({ID: uid(), Mulai: tglTambah(mulai, (f[0] - 1) * 7), Selesai: tglTambah(mulai, (f[1] - 1) * 7 + 4), Kegiatan: f[2], Jenis: jenis(f)}));
  DB.Akademik.push({ID: uid(), Mulai: tglTambah(mulai, 20 * 7), Selesai: tglTambah(mulai, 22 * 7 - 1), Kegiatan: 'Libur akhir semester', Jenis: 'Libur'});
  await persist('Akademik'); AK_BULAN = mulai.slice(0, 7); render();
}
function formAkademik(id) {
  const e = DB.Akademik.find(x => x.ID === id) || {};
  modal(`<h3>${id ? 'Edit' : 'Tambah'} kegiatan akademik</h3>
  <label class="f">Kegiatan<input id="a_k" value="${esc(e.Kegiatan || '')}"></label>
  <label class="f">Jenis<select id="a_j">${Object.keys(JENIS_AK).map(j => `<option ${(e.Jenis || 'Kegiatan sekolah') === j ? 'selected' : ''}>${j}</option>`).join('')}</select></label>
  <div class="grid g2" style="grid-template-columns:1fr 1fr"><label class="f">Mulai<input type="date" id="a_m" value="${esc(e.Mulai || '')}"></label><label class="f">Selesai (kosongkan jika sehari)<input type="date" id="a_s" value="${esc(e.Selesai || '')}"></label></div>
  <div class="row end"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn ok" onclick="simpanAkademik('${id}')">Simpan</button></div>`);
}
async function simpanAkademik(id) {
  const k = $('#a_k').value.trim(), m = $('#a_m').value, s = $('#a_s').value;
  if (!k || !m) return toast('Kegiatan dan tanggal mulai wajib diisi');
  if (s && s < m) return toast('Tanggal selesai sebelum tanggal mulai');
  let e = DB.Akademik.find(x => x.ID === id); if (!e) { e = {ID: uid()}; DB.Akademik.push(e); }
  Object.assign(e, {Kegiatan: k, Jenis: $('#a_j').value, Mulai: m, Selesai: s});
  closeModal(); await persist('Akademik'); AK_BULAN = m.slice(0, 7); render();
}
async function hapusAkademik(id) { if (!await ask('Hapus kegiatan ini?')) return; DB.Akademik = DB.Akademik.filter(x => x.ID !== id); await persist('Akademik'); render(); }

/* ---------- PERANGKAT AJAR: TUJUAN PEMBELAJARAN, MODUL AJAR/RPP, SLIDE PEMANTIK ---------- */

async function setStatusTP(id, v) { const x = DB.TP.find(r => r.ID === id); if (x) { x.Status = v; await persist('TP'); render(); } }

  Inti: 'Kegiatan 1: ...\nKegiatan 2: ...\nDiferensiasi: sesuaikan konten, proses, dan produk dengan kesiapan siswa',

async function simpanModul(id) {

async function gandaModul(id) {

async function hapusModul(id) { if (!await ask('Hapus modul ajar ini?')) return; DB.Modul = DB.Modul.filter(m => m.ID !== id); await persist('Modul'); render(); }

/* Slide pemantik */

  const ls = pemK();

const slideList = p => (p.Slide || '').split(/\n\s*-{3,}\s*\n?/).map(x => x.trim()).filter(Boolean);
function formPemantik(id) {

async function simpanPemantik(id) {
  const j = $('#pm_j').value.trim(), t = $('#pm_t').value.trim(); if (!j) return toast('Judul wajib diisi');
  if (t && !urlAman(t)) return toast('Tautan harus diawali http:// atau https://');

  Object.assign(x, {Judul: j, Pertanyaan: $('#pm_q').value.trim(), Slide: $('#pm_s').value.trim(), Tautan: t});
  closeModal(); await persist('Pemantik'); render();

async function hapusPemantik(id) { if (!await ask('Hapus slide pemantik ini?')) return; DB.Pemantik = DB.Pemantik.filter(p => p.ID !== id); await persist('Pemantik'); render(); }
function presMulai(id) {
  const p = DB.Pemantik.find(x => x.ID === id); if (!p) return;
  const sl = ['# ' + p.Judul]; if (p.Pertanyaan) sl.push('Pertanyaan pemantik\n' + p.Pertanyaan);
  slideList(p).forEach(s => sl.push(s));
  PRES = {slides: sl, i: 0}; $('#pres').classList.add('on'); presRender();
}
function presRender() {
  const s = PRES.slides[PRES.i].replace(/^# /, ''), baris = s.split('\n');
  $('#pres').innerHTML = `<div class="ps"><h1>${esc(baris[0])}</h1><div>${br(baris.slice(1).join('\n'))}</div></div>
  <div class="pc"><button class="btn ghost sm" onclick="presGeser(-1)">◀</button><span>${PRES.i + 1} / ${PRES.slides.length}</span><button class="btn ghost sm" onclick="presGeser(1)">▶</button><button class="btn bad sm" onclick="presTutup()">Tutup</button></div>`;
}
function presGeser(n) { PRES.i = Math.max(0, Math.min(PRES.slides.length - 1, PRES.i + n)); presRender(); }
function presTutup() { PRES = null; $('#pres').classList.remove('on'); }
document.addEventListener('keydown', e => {
  if (!PRES) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); presGeser(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); presGeser(-1); }
  else if (e.key === 'Escape') presTutup();
});

/* ================= LOGIN ================= */
let LOGIN_MODE = 'admin', ADMIN_ADA = true;
function simpanToken(t, role) { try { if (t) { sessionStorage.setItem('mk_token', t); sessionStorage.setItem('mk_role', role || ''); } else { sessionStorage.removeItem('mk_token'); sessionStorage.removeItem('mk_role'); } } catch (_) {} }
function sesiHabis() { tampilLogin('Sesi berakhir, silakan masuk lagi.'); }
function tampilLogin(pesan) {
  TOKEN = ''; ROLE = ''; PERAN = 'admin'; PORTAL = null; simpanToken('');
  DB = {Pengaturan: {}, Kelas: [], Siswa: []};
  document.body.classList.remove('sb', 'sbopen');
  $('#view').innerHTML = ''; $('#nav').innerHTML = ''; $('#subJudul').textContent = ''; $('#kelasSel').style.display = ''; closeModal();
  const adm = LOGIN_MODE === 'admin';
  $('#login').innerHTML = `<div class="lbox"><h1>📚 Manajemen Kelas</h1>
    ${ADMIN_ADA ? `<div class="tabs2"><button class="btn ${adm ? '' : 'ghost'}" onclick="LOGIN_MODE='admin';tampilLogin()">Guru / Wali / Admin</button><button class="btn ${adm ? 'ghost' : ''}" onclick="LOGIN_MODE='siswa';tampilLogin()">Siswa</button></div>`
      : '<p class="lead">Selamat datang! Buat akun admin (guru) pertama.</p>'}
    <label class="f">${ADMIN_ADA ? (adm ? 'Nama pengguna' : 'NIS / NISN') : 'Nama pengguna admin'}<input id="lg_u" autocomplete="username" onkeydown="if(event.keyCode===13)$('#lg_p').focus()"></label>
    <label class="f">${ADMIN_ADA ? (adm ? 'Kata sandi' : 'PIN') : 'Kata sandi (minimal 8 karakter)'}<input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.keyCode===13)kirimLogin()"></label>
    ${ADMIN_ADA ? '' : '<label class="f">Ulangi kata sandi<input id="lg_p2" type="password" onkeydown="if(event.keyCode===13)kirimLogin()"></label>'}
    <div class="err" id="lg_err">${esc(pesan || '')}</div>
    <button class="btn" style="width:100%" onclick="kirimLogin()">${ADMIN_ADA ? 'Masuk' : 'Buat akun admin'}</button></div>`;
  $('#login').style.display = 'grid';
}
async function kirimLogin() {
  const u = $('#lg_u').value.trim(), p = $('#lg_p').value, err = $('#lg_err');
  if (!u || !p) { err.textContent = 'Lengkapi data masuk.'; return; }
  err.textContent = 'Memeriksa…';
  try {
    let r;
    if (!ADMIN_ADA) {
      if (p !== $('#lg_p2').value) { err.textContent = 'Kata sandi tidak sama.'; return; }
      r = await raw('api_setupAdmin', u, p); ADMIN_ADA = true;
    } else r = await raw('api_login', LOGIN_MODE, u, p);
    await masuk(r);
  } catch (e) { err.textContent = pesanErr(e); }
}
async function masuk(r) {
  TOKEN = r.token; ROLE = r.role; simpanToken(TOKEN, ROLE);
  SEK = null;
  $('#loading').style.display = 'grid'; $('#loading').textContent = 'Memuat data…';
  try {
    if (ROLE !== 'siswa') {
      DB = await api('api_load'); PERAN = DB.peran || 'admin';
      if (!DB.Kelas.length && PERAN === 'admin') { DB.Kelas.push({ID: uid(), Nama: 'Kelas 1', Mapel: ''}); await persist('Kelas'); }
      if (!DB.Kelas.length) { $('#loading').style.display = 'none'; tampilLogin('Akun Anda belum ditugaskan ke kelas mana pun. Hubungi admin.'); return; }
      K = DB.Kelas[0].ID; TAB = 'dash'; ABS_DRAFT = null;
      $('#login').style.display = 'none'; $('#loading').style.display = 'none'; render();
    } else {
      PORTAL = await api('api_loadSiswa'); DB = {Pengaturan: Object.assign({}, PORTAL.pengaturan, {mulai: PORTAL.mulaiSemester})};
      $('#login').style.display = 'none'; $('#loading').style.display = 'none'; renderPortal();
    }
  } catch (e) { $('#loading').style.display = 'none'; if (!TOKEN) return; tampilLogin(pesanErr(e)); }
}
async function muatUlang() {
  if (ROLE === 'siswa') { try { PORTAL = await api('api_loadSiswa'); renderPortal(); toast('✔ Data dimuat ulang'); } catch (e) { toast(pesanErr(e), 4000); } return; }
  try {
    toast('Memuat ulang…', 15000);
    const kLama = K, db = await api('api_load', true);
    DB = db; PERAN = DB.peran || 'admin'; K = DB.Kelas.some(x => x.ID === kLama) ? kLama : (DB.Kelas[0] || {}).ID;
    ABS_DRAFT = null; render(); toast('✔ Data dimuat ulang');
  } catch (e) { toast('Gagal: ' + pesanErr(e), 4000); }
}
async function keluar() { try { await raw('api_logout', TOKEN); } catch (_) {} tampilLogin(); }

/* ================= PORTAL SISWA ================= */
async function gantiPIN() {
  const l = $('#pn_l').value, b = $('#pn_b').value;
  if (!/^\d{4,8}$/.test(b)) return toast('PIN baru harus 4–8 angka');
  try { await api('api_gantiPIN', l, b); $('#pn_l').value = ''; $('#pn_b').value = ''; toast('✔ PIN berhasil diganti'); }
  catch (e) { toast('Gagal: ' + pesanErr(e), 4000); }
}
/* ---------- ABSENSI OLEH SEKRETARIS (akun siswa) ---------- */
let SEK = null;
const tglLokal = d => ymd(d);
async function muatSekretaris(tgl) {
  const el = $('#sek'); if (!el) return;
  tgl = tgl || (SEK && SEK.tanggal) || tglLokal(new Date());
  try {
    const r = await api('api_absensiKelas', tgl);
    SEK = {tanggal: r.tanggal, siswa: r.siswa, terkunci: r.terkunci, draft: {}, note: {}};
    r.catatan.forEach(c => { SEK.draft[c.SiswaID] = c.Kode; SEK.note[c.SiswaID] = c.Keterangan || ''; });
    renderSekretaris();
  } catch (e) { const m = pesanErr(e); if ($('#sek')) $('#sek').innerHTML = '<h3>✅ Absensi kelas (sekretaris)</h3><p class="err">' + esc(m) + '</p>'; }
}
function sekChips(sid) {
  return Object.keys(KODE).map(k => `<button class="chip ${SEK.draft[sid] === k ? 'on' : ''}" style="--c:${KODE[k][1]}" title="${KODE[k][0]}" ${SEK.terkunci ? 'disabled' : ''} onclick="sekSet('${sid}','${k}')">${k}</button>`).join(' ');
}
function sekSet(sid, k) { SEK.draft[sid] = SEK.draft[sid] === k ? '' : k; $('#sk_' + sid).innerHTML = sekChips(sid); $('#sk_cnt').textContent = sekHitung(); }
const sekHitung = () => SEK.siswa.filter(s => SEK.draft[s.ID]).length + ' / ' + SEK.siswa.length + ' terisi';
function sekSemua(k) { SEK.siswa.forEach(s => SEK.draft[s.ID] = k); renderSekretaris(); }
function renderSekretaris() {
  const el = $('#sek'); if (!el || !SEK) return;
  const hari = tglLokal(new Date()), min = tglLokal(new Date(Date.now() - 7 * 86400000));
  el.innerHTML = `<h3>✅ Absensi kelas (sekretaris)</h3>
  <p class="muted">Isi kehadiran teman sekelas. Bisa diubah sampai guru mengonfirmasi. Maksimal 7 hari ke belakang.</p>
  ${SEK.terkunci ? '<div class="warn" style="background:#fff4ee"><div>🔒 Absensi tanggal ini sudah diisi atau dikonfirmasi guru, jadi tidak bisa diubah dari akun siswa.</div></div>' : ''}
  <div class="row"><label>Tanggal <input type="date" value="${SEK.tanggal}" min="${min}" max="${hari}" onchange="muatSekretaris(this.value)"></label>
    ${SEK.terkunci ? '' : `<button class="btn ghost sm" onclick="sekSemua('H')">Semua Hadir</button><button class="btn ghost sm" onclick="SEK.draft={};renderSekretaris()">Kosongkan</button><span class="muted" id="sk_cnt">${sekHitung()}</span><button class="btn ok" style="margin-left:auto" onclick="simpanSekretaris()">💾 Simpan absensi</button>`}</div>
  <div class="muted" style="margin-bottom:8px">${Object.keys(KODE).map(k => `${kodeTag(k)} ${KODE[k][0]}`).join(' &nbsp; ')}</div>
  <div class="tw" style="max-height:420px;overflow:auto"><table><tr><th>#</th><th>Nama</th><th>Status</th><th>Keterangan</th></tr>
  ${SEK.siswa.map((s, i) => `<tr><td>${i + 1}</td><td><b>${esc(s.Nama)}</b></td><td id="sk_${s.ID}" style="white-space:nowrap">${sekChips(s.ID)}</td><td><input style="width:100%;min-width:140px" maxlength="200" ${SEK.terkunci ? 'disabled' : ''} value="${esc(SEK.note[s.ID] || '')}" oninput="SEK.note['${s.ID}']=this.value"></td></tr>`).join('')}</table></div>`;
}
async function simpanSekretaris() {
  const recs = SEK.siswa.filter(s => SEK.draft[s.ID]).map(s => ({SiswaID: s.ID, Kode: SEK.draft[s.ID], Keterangan: SEK.note[s.ID] || ''}));
  if (!recs.length) return toast('Isi status minimal satu siswa');
  try { toast('Menyimpan…', 8000); await api('api_simpanAbsensiSekretaris', SEK.tanggal, recs); toast('✔ Absensi tersimpan'); await muatSekretaris(SEK.tanggal); }
  catch (e) { toast('Gagal: ' + pesanErr(e), 5000); }
}
function renderPortal() {
  const p = PORTAL;
  $('#subJudul').textContent = p.sekolah + ' · ' + p.kelas + ' · ' + p.siswa.Nama;
  $('#kelasSel').style.display = 'none'; $('#nav').innerHTML = ''; document.body.classList.remove('sb', 'sbopen');
  const c = {H:0,S:0,I:0,A:0,T:0,D:0};
  p.absensi.forEach(a => { if (c[a.Kode] != null) c[a.Kode]++; });
  const hadir = c.H + c.T + c.D, pct = p.totalPertemuan ? hadir / p.totalPertemuan * 100 : null;
  const tepat = p.tugas.filter(t => t.Status === 'Tepat Waktu').length;
  const a = p.nilai ? akhir(p.nilai) : null, pr = predikat(a), w = bobot();
  const komp = [['Kehadiran & Sikap', 'Sikap'], ['Tugas & Harian', 'Tugas'], ['Proyek / Praktik', 'Proyek'], ['UTS', 'UTS'], ['UAS', 'UAS']];
  const warnaSt = {'Tepat Waktu': '#d9f7e8', 'Terlambat': '#ffe9cc', 'Belum': '#ffe3da'};
  $('#view').innerHTML = `
  <h2>Halo, ${esc(p.siswa.Nama)} 👋</h2>
  <p class="lead">${esc(p.kelas)}${p.mapel ? ' · ' + esc(p.mapel) : ''} · NIS ${esc(p.siswa.NIS)}</p>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat" style="background:#ff8fb1"><b>${pct == null ? '-' : fmt(pct) + '%'}</b><span>Kehadiran (${hadir} dari ${p.totalPertemuan} pertemuan)</span></div>
    <div class="stat" style="background:#4ade9b"><b>${tepat}/${p.tugas.length}</b><span>Tugas tepat waktu</span></div>
    <div class="stat" style="background:#ffd43b"><b>${fmt(a)}</b><span>Nilai akhir</span></div>
    <div class="stat" style="background:${pr[2]}"><b>${pr[0]}</b><span>${esc(pr[1] || 'Belum ada predikat')}</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Nilai</h3>${p.nilai ? `<div class="tw"><table><tr><th>Komponen</th><th class="c">Bobot</th><th class="c">Nilai</th><th class="c">Kontribusi</th></tr>
      ${komp.map((k, i) => { const v = num(p.nilai[k[1]]); return `<tr><td>${k[0]}</td><td class="c">${w[i]}%</td><td class="c">${v == null ? '-' : fmt(v)}</td><td class="c">${v == null ? '-' : fmt(v * w[i] / 100)}</td></tr>`; }).join('')}
      <tr><td><b>Nilai akhir</b></td><td class="c"><b>100%</b></td><td></td><td class="c"><b>${fmt(a)} → ${pr[0]}</b></td></tr></table></div>
      <p class="muted">Tindak lanjut: <b>${tindakLanjut(a)}</b> (batas ketuntasan ${kkm()}).</p>` : '<p class="muted">Nilai belum diinput oleh guru.</p>'}</div>
    <div class="card"><h3>Rekap kehadiran</h3><div class="row">${Object.keys(KODE).map(k => `${kodeTag(k)} ${KODE[k][0]}: <b>${c[k]}</b>`).join(' &nbsp; ')}</div>
      <div class="tw" style="max-height:260px;overflow:auto"><table><tr><th>Tanggal</th><th>Status</th><th>Keterangan</th></tr>
      ${p.absensi.slice().sort((x, y) => y.Tanggal.localeCompare(x.Tanggal)).map(r => `<tr><td>${esc(r.Tanggal)}</td><td>${kodeTag(r.Kode)} ${esc((KODE[r.Kode] || [''])[0])}</td><td>${esc(r.Keterangan)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Belum ada data.</td></tr>'}</table></div></div>
  </div>
  <div class="card"><h3>Tugas</h3><div class="tw"><table><tr><th>Judul</th><th>Jenis</th><th>Tenggat</th><th>Status</th><th class="c">Nilai</th></tr>
    ${p.tugas.map(t => `<tr><td>${esc(t.Judul)}</td><td>${esc(t.Jenis)}</td><td>${esc(t.Tenggat || '-')}</td><td><span class="tag" style="background:${warnaSt[t.Status] || '#efecfb'}">${esc(t.Status)}</span></td><td class="c">${esc(t.Nilai || '-')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Belum ada tugas.</td></tr>'}</table></div></div>
  ${p.sekretaris ? '<div class="card" id="sek"><h3>✅ Absensi kelas (sekretaris)</h3><p class="muted">Memuat…</p></div>' : ''}
  <div class="card"><h3>🗓️ Jadwal pelajaran</h3>${p.sistemJadwal === 'blok' && pekanIni() ? `<p><span class="tag" style="background:#ffd43b">Pekan ini: ${pekanIni()}</span></p>` : ''}${htmlJadwal(p.jadwal, false)}</div>
  <div class="card"><h3>🧹 Jadwal piket</h3>${(() => { const sy = p.piket.filter(x => x.Saya).map(x => x.Hari); return sy.length ? `<p>Jadwal piketmu: <b>${esc(sy.join(', '))}</b></p>` : ''; })()}${htmlPiket(p.piket, false)}</div>
  <div class="card"><h3>🪑 Denah tempat duduk</h3>${p.denah.kursi.length ? htmlPeta(num(p.denah.Baris) || 5, num(p.denah.Kolom) || 6, p.denah.Grup, Object.fromEntries(p.denah.kursi.map(k => [k.Baris + '-' + k.Kolom, {Nama: k.Nama, Saya: k.Saya}])), '') : '<p class="muted">Denah belum disusun oleh guru.</p>'}</div>
  <div class="card"><h3>🏛️ Struktur organisasi kelas</h3>${htmlStruktur(p.struktur, p.wali, false)}</div>
  <div class="card"><h3>📅 Kalender akademik</h3>${htmlAkList(p.akademik || [], false)}</div>
  <div class="card"><h3>Ganti PIN</h3><div class="grid g3"><label class="f">PIN lama<input id="pn_l" type="password" inputmode="numeric"></label><label class="f">PIN baru (4–8 angka)<input id="pn_b" type="password" inputmode="numeric" maxlength="8"></label></div>
    <button class="btn alt" onclick="gantiPIN()">Simpan PIN baru</button></div>`;
  if (p.sekretaris) muatSekretaris(SEK && SEK.tanggal);
}

/* ================= INIT ================= */
(async function mulai() {
  try {
    let t = '', role = ''; try { t = sessionStorage.getItem('mk_token') || ''; role = sessionStorage.getItem('mk_role') || ''; } catch (_) {}
    // Sesi tersimpan: langsung muat data (1 panggilan ke server, bukan 3 berurutan).
    if (t && role) { await masuk({token: t, role: role}); return; }
    const st = await raw('api_status'); ADMIN_ADA = st.adminAda;
    $('#loading').style.display = 'none'; tampilLogin();
  } catch (e) { $('#loading').textContent = 'Gagal memuat: ' + pesanErr(e); }
})();
</script>
</body>
